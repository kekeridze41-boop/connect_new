
name: Publish Connect APT Repository

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg apt-utils

      - name: Build DEB package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ошибка: требуется тег вида v1.0.1"
            exit 1
          fi

          bash packaging/build.sh "$VERSION"

      - name: Create APT repository
        run: |
          mkdir -p public
          cp dist/*.deb public/
          cp connect-archive-keyring.gpg public/

          cd public
          dpkg-scanpackages . /dev/null > Packages
          gzip -k -f Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Connect" \
            -o APT::FTPArchive::Release::Label="Connect" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            release . > Release

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" |
            gpg --batch --import

      - name: Sign APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          cd public

          printf '%s' "$GPG_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --local-user 79910FAC64F71C63 \
              --clearsign \
              --output InRelease Release

          printf '%s' "$GPG_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --local-user 79910FAC64F71C63 \
              --armor --detach-sign \
              --output Release.gpg Release

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
